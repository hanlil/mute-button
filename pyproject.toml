[project]
name = "mute-button"
version = "0.0.0"
description = "Make annoying people shut up"
requires-python = ">=3.13"
dependencies = [
    "librosa>=0.11.0",
    "onnxruntime>=1.26.0",
    "pyaudiowpatch>=0.2.12.7",
    "reflex>=0.9.4",
    "reflex-dynoselect>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
